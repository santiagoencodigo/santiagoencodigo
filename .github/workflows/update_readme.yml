name: Update README

on:
  schedule:
    - cron: "0 */12 * * *"   # Cada 12 horas (00:00 y 12:00)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Update Profile README
    steps:
      - uses: actions/checkout@v4

      - name: Update README with readme-engine
        uses: thisisrick25/readme-engine@v2
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLUGINS: prs
          PLUGIN_CONFIG: '{"prs": {"maxPrs": 5}}'
          COMMIT_AUTHOR_NAME: "santiagoencodigo"
          COMMIT_AUTHOR_EMAIL: "tu-correo@ejemplo.com"