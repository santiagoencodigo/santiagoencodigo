name: Update README

permissions:
  contents: write

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Update Profile README
    steps:
      - uses: actions/checkout@v4
      - uses: thisisrick25/readme-engine@v2
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLUGINS: prs
          PLUGIN_CONFIG: '{"prs": {"maxPrs": 5}}'
          COMMIT_AUTHOR_NAME: "santiagoencodigo"
          COMMIT_AUTHOR_EMAIL: "tu-correo@ejemplo.com"